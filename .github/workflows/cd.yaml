name: Terraform Deploy

on:
  pull_request: 
    branches: 
      - main
    types:
      - closed

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_ACCESS_KEY: ${{ secrets.TF_STATE_ACCESS_KEY }} 
  
jobs:
  terraform-plan:
    if: github.event.pull_request.merged == true
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./azure_terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Generate tfbackend and tfvars files
        run: |
          # Create config.tfbackend (Access key removed, handled by ENV var)
          cat <<EOF > config.tfbackend
          storage_account_name = "${{ secrets.TF_STATE_STORAGE_ACCOUNT }}"
          EOF
          
          # Create terraform.tfvars
          cat <<EOF > terraform.tfvars
          config = {
            username     = "${{ secrets.VM_USERNAME }}"
            ssh_key_path = "${{ secrets.VM_SSH_KEY_PATH }}"
            password     = "${{ secrets.VM_PASSWORD }}"
          }
          
          state = {
            storage_account_name = "${{ secrets.TF_STATE_STORAGE_ACCOUNT }}"
            # Access key removed here too if your modules don't strictly require it
          }
          EOF

      - name: Terraform Init
        run: terraform init -backend-config=config.tfbackend

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ./azure_terraform/tfplan 

  terraform-apply:
    if: github.event.pull_request.merged == true
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: production 
    defaults:
      run:
        working-directory: ./azure_terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Generate tfbackend file
        run: |
          cat <<EOF > config.tfbackend
          storage_account_name = "${{ secrets.TF_STATE_STORAGE_ACCOUNT }}"
          use_azuread_auth = true.
          EOF

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ./azure_terraform/ 

      - name: Terraform Init
        run: terraform init -backend-config=config.tfbackend

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan